<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access Denied | AccessIQ</title>
<style>
:root{--bg:#070b14;--panel:#0d1422;--line:rgba(148,163,184,.13);--text:#eef5ff;--muted:#b7c4d6;--cyan:#39d9ff;--red:#ff6b81;--blue:#5b7cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(91,124,255,.15),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(520px,92vw);padding:34px;border:1px solid rgba(255,107,129,.18);border-radius:22px;background:linear-gradient(145deg,rgba(14,23,38,.96),rgba(9,16,28,.96));text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}.icon{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:rgba(255,107,129,.09);color:#ff9aaa;font-size:30px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#ff9aaa;font-weight:800}.card h1{font-size:27px;margin:8px 0}.card p{color:#b7c4d6;font-size:12px;line-height:1.6}.permission{margin:18px 0;padding:13px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);color:#eef4fb;font-weight:700}.actions{display:flex;justify-content:center;gap:10px}.btn{display:inline-flex;padding:10px 15px;border-radius:10px;text-decoration:none;font-size:11px;font-weight:800}.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#07111b}.ghost{border:1px solid var(--line);color:#d0d9e5;background:rgba(255,255,255,.025)}.footer{margin-top:20px;color:#9aa8bb;font-size:9px}</style><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head>
<body><section class="card"><div class="icon"><i class="bi bi-shield-lock-fill"></i></div><div class="eyebrow">SECURITY BOUNDARY</div><h1>Access Denied</h1><p>You do not have the required permission to access this resource.</p><div class="permission">{{ permission if permission else "Restricted Access" }}</div><div class="actions"><a class="btn primary" href="{{ url_for('main.dashboard') }}">Back to Dashboard</a><a class="btn ghost" href="{{ url_for('main.logout') }}">Logout</a></div><div class="footer">ACCESSIQ SECURITY PLATFORM · Protected session</div></section></body></html>
