<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password | AccessIQ</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(37, 99, 235, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #071426
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            color: white;
        }


        .password-card {

            width: 100%;
            max-width: 500px;

            padding: 45px;

            background:
                rgba(10, 20, 38, 0.95);

            border:
                1px solid
                rgba(148, 163, 184, 0.2);

            border-radius: 18px;

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.45);
        }


        .header {
            text-align: center;
            margin-bottom: 35px;
        }


        .icon-box {

            width: 75px;
            height: 75px;

            margin:
                0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 32px;

            color: #38bdf8;

            background:
                rgba(37, 99, 235, 0.15);

            border:
                1px solid
                rgba(56, 189, 248, 0.3);
        }


        h1 {
            margin: 0 0 10px;

            font-size: 28px;
        }


        .subtitle {

            margin: 0;

            font-size: 14px;

            color: #94a3b8;

            line-height: 1.6;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #cbd5e1;
        }


        .input-wrapper {
            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #64748b;
        }


        input {

            width: 100%;
            height: 52px;

            padding:
                0 45px;

            border-radius: 10px;

            border:
                1px solid
                rgba(148, 163, 184, 0.25);

            background:
                rgba(15, 23, 42, 0.7);

            color: white;

            outline: none;

            font-size: 14px;
        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        .submit-button {

            width: 100%;
            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #0ea5e9
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        .submit-button:hover {

            box-shadow:
                0 10px 25px
                rgba(37, 99, 235, 0.25);
        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 13px;
        }


        .back-link:hover {
            color: #38bdf8;
        }


        .message {

            margin-bottom: 20px;

            padding: 13px;

            border-radius: 9px;

            font-size: 13px;

            text-align: center;
        }


        .error {

            background:
                rgba(127, 29, 29, 0.25);

            border:
                1px solid
                rgba(248, 113, 113, 0.3);

            color: #fca5a5;
        }


        .success {

            background:
                rgba(20, 83, 45, 0.25);

            border:
                1px solid
                rgba(74, 222, 128, 0.3);

            color: #86efac;
        }

    </style>

</head>


<body>


    <div class="password-card">


        <div class="header">

            <div class="icon-box">
                <i class="bi bi-key-fill"></i>
            </div>


            <h1>Change Password</h1>


            <p class="subtitle">
                Update your password to keep your
                AccessIQ account secure.
            </p>

        </div>



        {% if error %}

            <div class="message error">

                <i class="bi bi-exclamation-circle"></i>

                {{ error }}

            </div>

        {% endif %}



        {% if success %}

            <div class="message success">

                <i class="bi bi-check-circle"></i>

                {{ success }}

            </div>

        {% endif %}



        <form method="POST">


            <!-- CURRENT PASSWORD -->

            <div class="form-group">

                <label>
                    Current Password
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-lock input-icon"></i>


                    <input
                        type="password"
                        name="current_password"
                        placeholder="Enter current password"
                        required
                    >

                </div>

            </div>



            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label>
                    New Password
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-key input-icon"></i>


                    <input
                        type="password"
                        name="new_password"
                        placeholder="Enter new password"
                        required
                    >

                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    Confirm New Password
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-shield-lock input-icon"></i>


                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                </div>

            </div>



            <button
                type="submit"
                class="submit-button"
            >

                <i class="bi bi-shield-check"></i>

                Update Password

            </button>


        </form>



        <a
            href="{{ url_for('main.dashboard') }}"
            class="back-link"
        >

            <i class="bi bi-arrow-left"></i>

            Back to Dashboard

        </a>


    </div>


</body>

</html>
